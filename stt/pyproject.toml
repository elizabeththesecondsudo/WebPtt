[project]
name = "voice-command-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141,<1",
    "faster-whisper>=1.2,<2",
    "numpy>=2,<3",
    "uvicorn>=0.52,<1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
